name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: |
          go vet ./...
          go test -count=1 ./...

      # Produces, for each arch, routini-runner_<version>_linux_<arch>.tar.gz
      # (version without the leading "v") containing routini-runner, LICENSE
      # and README.md, plus sha256sums.txt. scripts/install.sh relies on
      # these names.
      - name: Build
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          VERSION="${TAG#v}"
          rm -rf build dist
          mkdir -p dist
          for ARCH in amd64 arm64; do
            NAME="routini-runner_${VERSION}_linux_${ARCH}"
            mkdir -p "build/$NAME"
            CGO_ENABLED=0 GOOS=linux GOARCH="$ARCH" go build -trimpath \
              -ldflags "-s -w -X github.com/nvasion/routini-runner/internal/version.Version=${VERSION}" \
              -o "build/$NAME/routini-runner" ./cmd/routini-runner
            cp LICENSE README.md "build/$NAME/"
            tar -C "build/$NAME" -czf "dist/$NAME.tar.gz" routini-runner LICENSE README.md
          done
          (cd dist && sha256sum *.tar.gz > sha256sums.txt)
          cat dist/sha256sums.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes --verify-tag
          fi
